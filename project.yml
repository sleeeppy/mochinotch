name: Mochinotch
options:
  bundleIdPrefix: dev.sleeeppy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Mochinotch:
    type: application
    platform: macOS
    sources:
      - path: Mochinotch
        excludes:
          - Info.plist
          - AppIcon.icns
      - path: Mochinotch/AppIcon.icon
        type: folder
        buildPhase: resources
      - path: Assets/MochinotchIcon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sleeeppy.mochinotch
        PRODUCT_NAME: Mochinotch
        MARKETING_VERSION: "0.3.6"
        CURRENT_PROJECT_VERSION: "13"
        INFOPLIST_FILE: Mochinotch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - "-lsqlite3"
    dependencies:
      - sdk: ScreenCaptureKit.framework
